<div class="blog-sb-widget multishopcategories_widget">
    <h3 class="widgettitle">Categorias</h3>

    <div class="section-sb-current">
        <ul class="section-sb-list">
            {% for categoria in categorias %}
            <li>
                <a href="{% url 'productosPorCategoria' categoria.id %}">
                    <span class="section-sb-label">{{categoria.nombre}} 
                        <span class="count">{{categoria.producto_set.all.count}}</span>
                    </span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>

<!-- categoria.producto_set.all.count → hace que se cuente todos los objetos de un subconjunto de un objeto, 
 en este caso el conjunto es categoria, el subconjunto producto, set hace el listado de los objetos, all hace que se muestren todos 
 no solo el primero y count los cuenta -->
